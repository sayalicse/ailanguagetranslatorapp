plugins {
    alias(libs.plugins.android.application)
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.example.call_translator'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.example.call_translator"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    packagingOptions {
        resources {
            excludes += [
                    "META-INF/DEPENDENCIES",
                    "META-INF/INDEX.LIST",
                    "META-INF/LICENSE",
                    "META-INF/LICENSE.txt",
                    "META-INF/NOTICE",
                    "META-INF/NOTICE.txt"
            ]
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
configurations.all {
    resolutionStrategy {
        force 'com.google.protobuf:protobuf-javalite:3.25.5'
    }

    // Exclude protobuf-java everywhere — use javalite only
    exclude group: 'com.google.protobuf', module: 'protobuf-java'

    // Exclude proto-google-common-protos — Firebase's version covers it
    exclude group: 'com.google.api.grpc', module: 'proto-google-common-protos'
}
dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    implementation 'com.google.mlkit:translate:17.0.2'
    implementation platform('com.google.firebase:firebase-bom:34.9.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-firestore:24.9.1'
    implementation 'com.google.firebase:firebase-auth:22.3.0'
    implementation 'io.agora.rtc:full-sdk:4.2.3'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.cloud:google-cloud-speech:4.3.0'

    implementation('com.google.cloud:google-cloud-speech:4.3.0') {
        exclude group: 'com.google.protobuf', module: 'protobuf-java'
        exclude group: 'com.google.api.grpc', module: 'proto-google-common-protos'
    }

    implementation('io.grpc:grpc-okhttp:1.57.0') {
        exclude group: 'com.google.protobuf', module: 'protobuf-java'
    }
}